<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pregunta - Test de Razonamiento</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <main class="contenedor">

    <section class="tarjeta">

      <div class="encabezado">
        <img class="logo-uam" src="https://logosnicas.com/wp-content/uploads/2022/08/universidad_americana_2020.png" alt="Logo UAM">
        <h1>Test de Razonamiento</h1>
        <p>Universidad Americana</p>
      </div>

      <div class="contenido">

        <div class="panel-info">
          <p><strong>Estudiante:</strong> <span id="nombreCompleto"></span></p>
          <p><strong>Fecha:</strong> <span id="fechaTest"></span></p>
          <p><strong>Hora de inicio:</strong> <span id="horaInicio"></span></p>
          <p><strong>Tiempo restante:</strong> <span id="temporizador" class="temporizador">00:00</span></p>
        </div>

        <h2 id="numeroPregunta">Pregunta</h2>

        <div class="pregunta-box">
          <p id="textoPregunta">Aquí aparecerá la pregunta del test.</p>
        </div>

        <form id="formOpciones" class="opciones">
          <label class="opcion">
            <input type="radio" name="respuesta" value="A">
            <span id="opcionA">Opción A</span>
          </label>

          <label class="opcion">
            <input type="radio" name="respuesta" value="B">
            <span id="opcionB">Opción B</span>
          </label>

          <label class="opcion">
            <input type="radio" name="respuesta" value="C">
            <span id="opcionC">Opción C</span>
          </label>

          <label class="opcion">
            <input type="radio" name="respuesta" value="D">
            <span id="opcionD">Opción D</span>
          </label>
        </form>

      </div>

      <div class="acciones">
        <button onclick="siguientePregunta()">Siguiente</button>
      </div>

    </section>

  </main>

  <script src="script.js"></script>
</body>
</html>
