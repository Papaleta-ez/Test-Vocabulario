<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Test Finalizado</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <main class="contenedor">

    <section class="tarjeta final">

      <div class="encabezado">
        <img class="logo-uam" src="https://logosnicas.com/wp-content/uploads/2022/08/universidad_americana_2020.png" alt="Logo UAM">
        <h1>Test de Razonamiento</h1>
        <p>Universidad Americana</p>
      </div>

      <div class="contenido mensaje-final">
        <h2>Test finalizado</h2>

        <p>
          Su intento ha sido finalizado correctamente.
        </p>

        <p>
          Gracias por completar la evaluación.
        </p>
      </div>

      <div class="acciones">
        <button onclick="alert('Test finalizado correctamente.')">Finalizar intento</button>
      </div>

    </section>

  </main>

  <script src="script.js"></script>
</body>
</html>
