<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Fin del Test</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="corpus">

    <div class="header">
      <h1>Test de Razonamiento</h1>
      <h2>Fin del test</h2>
    </div>

    <div class="body">

      <h3>Resultados del estudiante</h3>

      <div class="info-test">
        <p><strong>Estudiante:</strong> <span id="finNombre"></span></p>
        <p><strong>Tipo de test:</strong> <span id="finTipoTest"></span></p>
        <p><strong>Fecha:</strong> <span id="finFecha"></span></p>
        <p><strong>Hora de inicio:</strong> <span id="finHoraInicio"></span></p>
        <p><strong>Hora de finalización:</strong> <span id="finHoraFin"></span></p>
      </div>

      <p><strong>Aciertos:</strong> <span id="finAciertos"></span></p>
      <p><strong>Desaciertos:</strong> <span id="finDesaciertos"></span></p>
      <p><strong>Total de preguntas:</strong> <span id="finTotal"></span></p>

      <h3 id="mensajeFinal"></h3>

    </div>

    <div class="footer">
      <button onclick="reiniciarTest()">Volver al inicio</button>
    </div>

  </div>

  <script src="script.js"></script>
</body>
</html>
