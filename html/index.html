<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Test de Razonamiento - UAM</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <main class="contenedor">

    <section class="tarjeta">

      <div class="encabezado">
        <img class="logo-uam" src="https://logosnicas.com/wp-content/uploads/2022/08/universidad_americana_2020.png" alt="Logo UAM">
        <h1>Test de Razonamiento</h1>
        <p>Universidad Americana</p>
      </div>

      <div class="contenido">
        <h2>Instrucciones</h2>

        <p>
          Lea cuidadosamente cada pregunta antes de responder.  
          Seleccione solamente una opción por pregunta.
        </p>

        <p>
          Una vez iniciado el test, deberá completarlo en el tiempo establecido.
          El intento solo podrá realizarse una vez.
        </p>

        <form class="formulario">
          <label for="nombres">Nombres</label>
          <input type="text" id="nombres" placeholder="Ingrese sus nombres">

          <label for="apellidos">Apellidos</label>
          <input type="text" id="apellidos" placeholder="Ingrese sus apellidos">

          <label for="tipoTest">Seleccione el test</label>
          <select id="tipoTest">
            <option value="A">Forma A - 10 minutos</option>
            <option value="B">Forma B - 12 minutos</option>
          </select>
        </form>
      </div>

      <div class="acciones">
        <button onclick="comenzarTest()">Comenzar test</button>
      </div>

    </section>

  </main>

  <script src="script.js"></script>
</body>
</html>
